
services:
  - type: web
    name: f1-grand-prix-racer
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: GAME_URL
        sync: false
      - key: NODE_VERSION
        value: "20"
